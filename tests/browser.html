<!doctype html>
<meta charset="utf-8">
<title>Eficy isolated runtime test</title>
<style>html,body{height:100%;margin:0}</style>
<script type="module">
  import { createPreviewFrame } from '/frame.js';
  window.reports = [];
  window.addEventListener('message', event => {
    if (event.source === window.preview?.element.contentWindow) window.reports.push(event.data);
  });
  window.preview = createPreviewFrame();
  window.preview.update(`import { React } from 'eficy'; import { Button } from 'shadcn'; export default function App() { const [n, setN] = React.useState(0); return <Button onClick={() => setN(n + 1)}>Count {n}</Button>; }`);
  document.body.append(window.preview.element);
</script>
