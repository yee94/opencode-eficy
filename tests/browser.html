<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eficy isolated runtime test</title>
<style>html,body{height:100%;margin:0}</style>
<script type="module">
  import { createPreviewFrame } from '/frame.js';
  window.reports = [];
  window.addEventListener('message', event => {
    if (event.source === window.preview?.element.contentWindow) window.reports.push(event.data);
  });
  window.preview = createPreviewFrame({ theme: 'dark' });
  const sample = new URLSearchParams(location.search).get('sample') || 'analytics';
  window.preview.update(await (await fetch('/sample/' + sample)).text());
  document.body.append(window.preview.element);
</script>
